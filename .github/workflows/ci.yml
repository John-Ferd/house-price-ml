name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src scripts tests
      - run: pytest -q
      - run: python scripts/train.py --synthetic      # end-to-end training run on tiny synthetic data

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t house-price-api .      # serves the committed models/model.joblib
      - run: docker run -d -p 8000:8000 --name api house-price-api
      - name: Wait for the API, then call it
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health | grep -q '"status":"ok"'
          curl -sf -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"instances":[{"longitude":-122.23,"latitude":37.88,"housing_median_age":41,"total_rooms":880,"total_bedrooms":129,"population":322,"households":126,"median_income":8.3252,"ocean_proximity":"NEAR BAY"}]}'
