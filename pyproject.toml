[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "house-price-ml"
version = "0.1.0"
description = "California Housing price model with CV model selection and a FastAPI service"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn==1.9.1", "joblib", "fastapi", "uvicorn", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402"]
